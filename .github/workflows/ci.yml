name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Bash syntax check
        run: bash -n init-project.sh lib/*.sh tests/run.sh

      - name: ShellCheck
        run: shellcheck -x --severity=warning init-project.sh tests/run.sh

      - name: Set up DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          version: 1.25.4
          autostart: false

      - name: Run test suite
        run: ./tests/run.sh
