; Example PHP development configuration.

[PHP]
memory_limit = 512M
max_execution_time = 300

[opcache]
; OPcache is enabled for performance while code changes are checked immediately.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 30000

; A larger realpath cache helps frameworks with many PHP files.
realpath_cache_size = 4096K
realpath_cache_ttl = 600
